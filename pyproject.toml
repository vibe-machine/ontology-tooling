[project]
name = "ontology-tooling"
version = "0.1.0"
description = "Ontology release orchestration and TypeDB integration testing"
requires-python = ">=3.12"
dependencies = [
  "typedb-driver>=2.29.0",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "typedb: tests requiring a live TypeDB instance",
]
